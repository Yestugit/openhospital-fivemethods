    "usage": {
      "inputs": "Text events; learn requires task, a nonempty trajectory and real boolean success. episode_id is generated when omitted; provide events in the episode unless events were observed with an explicit matching ID. Observe journals events without native learning.",
      "attribution": "Record the complete contributions actually applied in episode.applied_memory. MemRL query grouping stays in contribution.extensions.memrl, including empty-item results.",
      "batches": "learn absorbs complete feedback-bearing experiences. At batch_size it automatically builds/refines native memories and updates Q-values in profile order. On the last experience of finite training, extensions.memrl.end_of_training=true also processes that scope's incomplete batch. Evolution stays internal; no public evolve operation is exposed.",
      "persistence": "flush/save/load/close never start batch learning. Restore explicitly with load; keep native snapshot directories alongside the JSON checkpoint.",
      "providers": "Configure providers.llm and providers.embedding; profile defaults remain available. MemOS also needs API credentials or an existing mos_config_path.",
      "profiles": "Default/HLE batch size 32; ALFWorld 32, BigCodeBench 25, LLB 5. Each profile retains its native add/update order.",
      "extensions": "retrieve accepts extensions.memrl.task_type for configured task thresholds; learn accepts task_id, task_type and optional end_of_training in episode.extensions.memrl.",
      "boundaries": "A full batch or the last learn marked end_of_training triggers internal evolution. Frozen evaluation never triggers evolution; flush/save/load/close only preserve pending work."
    }
  },
  "implementation_notes": [
    "The adapter delegates build, query retrieval, MemOS persistence, adjustment, ranking, and Q-value updates to MemTensor/MemRL revision c1b322ca43de36ddf64c6712f89d0095bfc35ce0, included under methods/memrl/_vendor with its MIT license and a revision/SHA-256 inventory. All native service strategies, providers, public configuration, and required utilities are included; benchmark runners and datasets are outside this memory plugin. Runtime and tests do not require plan/.",
    "The MemAtlas default is the official HLE experiment profile, not an upstream universal default: batch_size=32, k_retrieve=5, topk=3, tau/sim_threshold=0.25, and source HLE normalization values. HLE-written metadata initializes q_value to 1 for success and 0 for failure, independently of RLConfig.q_init_pos/q_init_neg.",
    "The service_defaults variant preserves the former public config/service parameter combination at batch_size=1. hle_episode explicitly changes the HLE batch size to 1. Official ALFWorld, BigCodeBench, and LLB profiles are also declared under config_schema.x-variants; their effective runner batch sizes are 32, 25, and 5.",
    "Memory v2 learn accumulates complete experiences and runs private batch evolution at batch_size or when the last training experience sets extensions.memrl.end_of_training=true. Native memory formation/refinement and value updates retain profile order; flush only persists state.",
    "HLE performs native add_memories before update_values; ALFWorld, BigCodeBench, and LLB perform update_values before add_memories. LLB profiles use the service normalization defaults that its runner actually retains, rather than unused YAML normalization fields.",
    "The default profile requires framework LLM and embedding providers plus API credentials for MemOS GeneralMemCube's own text-memory backend; mos_config_path supplies an existing input configuration and is never treated as a runtime output storage path.",
    "The MemOS simple_struct reader requires the optional chonkie sentence chunker; it is declared explicitly along with qdrant-client. OpenAI and tenacity constraints include MemoryOS 1.0.0's own bounds.",
    "Adapter logs use mematlas.methods.memrl.adapter; native upstream logging remains under memrl.* and memos.*.",
    "MemoryOS 1.0.0 calls QdrantClient.search for native query/avefact strategies; qdrant-client is constrained below 1.16, which removed that API."
  ],
  "limitations": [
    "The bundled source already includes test/memrl/memrl-vector-dimension.patch, which preserves the upstream default of 3072 while forwarding configured embedding dimensions to live and restored Qdrant collections. An explicit runtime.source_roots.memrl override using unpatched upstream source needs this patch for non-3072 embeddings; preflight checks all required dimension markers.",
    "Preflight verifies the bundled UPSTREAM.json revision and file hashes. Explicit runtime.source_roots.memrl overrides are supported; missing files, invalid source inventories, or a known mismatched revision are rejected. Archives without Git metadata or a source inventory are explicitly reported as revision-unverified.",
    "MemRL's native retrieve_query mutates local retrieval caches; read-only test evaluation uses native state snapshots and restores them, so it requires save/load.",
    "MemRL stores a single user_id per MemoryService. The adapter derives one stable upstream user_id from the configured prefix and the complete MemAtlas scope.",
    "Upstream checkpoint snapshots are directory-based; MemAtlas state stores local snapshot path references and is not portable without the referenced native files.",
    "Evolution is internal at a full batch or an explicit training-end signal on the last learn; public evolve is unsupported. Incomplete batches remain pending across save/load and continue accumulating. flush/save/close do not evolve them.",
    "MemoryEpisode.task, a nonempty text trajectory and external boolean success are required. Preserve actual retrieval contributions through applied_memory."
  ],
  "tags": [
    "episodic",
    "procedural",
    "reinforcement-learning",
    "feedback"
  ],
