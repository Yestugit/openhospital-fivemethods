{
  "method_id": "memrl",
  "name": "MemRL",
  "summary": "Procedural episodic memory with MemOS/Qdrant storage and feedback-driven Q-value retrieval.",
  "version": "1",
  "paper_url": "https://arxiv.org/abs/2601.03192",
  "repository_url": "https://github.com/MemTensor/MemRL",
  "source_subdir": "methods/memrl/_vendor",
  "recommended_executor": "in_process",
  "fidelity": "upstream_source_adapter",
  "implementation_strategy": "direct_upstream_memory_service",
  "internal_token_tracking": "tracked",
  "capabilities": {
    "modalities": [
      "text"
    ],
    "forms": [
      "procedural"
    ],
    "operations": ["index", "add", "search", "episode_end", "flush", "save", "load"],
    "integration_slots": [
      "context",
      "episode"
    ],
    "accepted_events": [
      "message",
      "observation",
      "action",
      "tool_result",
      "feedback"
    ],
    "scopes": [
      "user",
      "agent",
      "team",
      "session",
      "run"
    ],
    "default_scope": "user",
    "required_episode_fields": [
      "success",
      "task",
      "trajectory"
    ],
    "requires_training": false,
    "requires_gpu": false,
    "supports_persistence": true,
    "supports_async": true,
    "read_only_mode": "snapshot"
  },
  "storage": {
    "kind": "local_files",
    "backend": "MemOS GeneralMemCube + local Qdrant",
    "path_parameters": {},
    "database_paths": [
      "results/mem_cubes/<user_id>/<timestamp>/",
      "results/qdrant/<user_id>/<timestamp>/",
      "<artifact_dir>/memrl/users/<user_id>.db",
      "<artifact_dir>/memrl/snapshots/<scope>/<logical-state-digest>/",
      "<artifact_dir>/memrl/adapter_state.json"
    ],
    "supports_snapshot": true
  },
