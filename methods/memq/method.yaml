{
  "method_id": "memq",
  "name": "MemQ",
  "summary": "Procedural episodic memory with Q-guided retrieval and TD(lambda) credit propagation over a provenance DAG.",
  "version": "0.1.0",
  "paper_url": "https://arxiv.org/abs/2605.08374",
  "repository_url": "https://github.com/SII-MemQ/MemQ",
  "source_subdir": "methods/memq/_vendor",
  "recommended_executor": "in_process",
  "fidelity": "upstream_source_adapter",
  "implementation_strategy": "direct_upstream_memory_service",
  "internal_token_tracking": "tracked",
  "capabilities": {
    "modalities": ["text", "image"],
    "forms": ["procedural", "graph", "policy"],
    "operations": ["observe", "retrieve", "learn", "commit", "command", "reset", "save_state", "load_state"],
    "integration_slots": ["context", "episode"],
    "accepted_events": ["message", "observation", "action", "tool_result", "feedback", "episode_start", "episode_end"],
    "scopes": ["user", "agent", "team", "session", "run"],
    "default_scope": "user",
    "required_episode_fields": ["success", "task", "trajectory"],
    "requires_training": false,
    "requires_gpu": false,
    "supports_persistence": true,
    "supports_async": true,
    "history_ingestion": "outcome",
    "read_only_mode": "snapshot"
  },
  "storage": {
    "kind": "local_files",
    "backend": "Upstream MemQ MemoryStore NumPy vectors/payloads plus local query cache snapshots",
    "path_parameters": {"storage_path": "directory"},
    "database_paths": [
      "<storage_path>/scopes/<scope-hash>/snapshot/<checkpoint>/vectors.npy",
      "<storage_path>/scopes/<scope-hash>/snapshot/<checkpoint>/payloads.json",
      "<storage_path>/scopes/<scope-hash>/snapshot/<checkpoint>/local_cache/dict_memory.json",
      "<storage_path>/scopes/<scope-hash>/snapshot/<checkpoint>/local_cache/query_embeddings.json",
      "<storage_path>/adapter_state.json",
      "<artifact_dir>/memq/provider_logs/"
    ],
    "supports_snapshot": true
  },
  "requirements": {
    "python": ["openai", "pandas", "PyYAML", "click", "pydantic", "numpy", "tenacity", "tqdm", "tiktoken"],
    "python_constraints": {
      "openai": ">=1.0.0",
      "pandas": ">=2.0.0",
      "PyYAML": ">=6.0",
      "click": ">=8.0",
      "pydantic": ">=2.0",
      "numpy": ">=1.24.0",
      "tenacity": ">=8.0.0",
      "tqdm": ">=4.60.0",
      "tiktoken": ">=0.5.0"
    },
    "services": ["llm", "embedding"]
  },
  "implementation_notes": [
    "Loads the complete native memory import closure included under methods/memq/_vendor at revision 9d66abf4f0252b084f088d5081c44b840842e47b. All native build/retrieve/update strategies, NumPy MemoryStore, prompts, provider implementations, public config models, and utilities are retained with the MIT license and UPSTREAM.json file hashes. Runtime and tests do not require plan/.",
    "The default profile follows the effective official LCB template/launcher: proceduralization + query + adjustment, batch_size/num_workers=50, num_epochs=5, batch direct-value updates and epoch MemQ propagation, alpha=0.3, gamma=0.5, lambda=0.8, and similarity/Q weights 0.7/0.3.",
    "Official LLB, BFCL, GPQA, DSBench, ERQA, and MMMU profiles retain their effective template/launcher parameters. LLB uses batch_size=64, num_epochs=20 and epoch direct-value updates. DSBench memory operations use the launcher's 8192-token memory limit, separately from its 16384-token agent limit.",
    "learn queues a complete scope batch. The native runner phases retain direct-value updates/Q-max before add, deferred epoch feedback and Bellman propagation at their actual profile boundaries. GPQA skips direct-value updates for algorithm=memq. LCB/LLB/ERQA/MMMU use ordered 10000-key provenance FIFO with extend/move-to-end; DSBench retains setdefault/extend without FIFO eviction. BFCL always performs epoch MemQ propagation even when memq_update_mode requests batch, and its direct epoch-update guard does not include algorithm=memq.",
    "Commands begin_epoch/end_epoch, begin_batch/end_batch and set_epoch_info expose the existing runner boundaries. begin_epoch and set_epoch_info accept zero-based current_epoch and total_epochs. commit persists native data and pending queues without forcing a learning boundary; close does not implicitly flush them.",
    "save_state/load_state use schema-2 inline JSON, embedding native vectors.npy/payloads.json bytes and a logical sidecar for Q-max, traces, epoch settings, ordered caches/DAG, last retrieval and pending queues. Python's process-global random state is also saved/restored for native epsilon-greedy. Restore calls native MemoryStore.load and restores the sidecar without the service loader's cache filtering or implicit re-embedding. commit writes <storage_path>/adapter_state.json; storage_path defaults to <artifact_dir>/memq.",
    "The adapter inherits native OpenAILLM.generate and OpenAIEmbedder.embed without replacing their retries, keyword/script prompts, circuit breaker, or chunk/merge behavior. Synchronous SDK client facades convert framework text/vector responses into the native response shape. Official circuit-breaker settings are retained per scope service; native provider logs live under <artifact_dir>/memq/provider_logs/.",
    "MethodServices returns final text/vectors without upstream SDK streaming/usage/finish_reason metadata. The native non-streaming generate branch is used; response metadata remains unknown, native provider token counters remain zero, and real provider usage is measured separately by the framework ledger.",
    "Core package dependencies follow upstream pyproject.toml. tqdm and tiktoken come from upstream requirements.txt and are declared for native progress reporting and optional token truncation; benchmark-only dependencies are outside the memory import closure.",
    "Adapter logs use mematlas.methods.memq.adapter; native algorithm logs retain the memq.* logger namespace and [MemQ] records."
  ],
  "limitations": [
    "A boolean external EpisodeOutcome.success and task text in outcome.metadata['task'] are required. The source reward is selected from success_reward/failure_reward; EpisodeOutcome.reward is not substituted.",
    "The native retrieve_query path mutates retrieval_count/last_used_at; read-only test evaluation uses native state snapshots and restores them, so it requires save_state/load_state.",
    "Each complete MemAtlas scope gets a separate upstream MemoryService and native user_id because MemQ stores one user bank per service.",
    "MemAtlas has no automatic benchmark epoch/tail-batch hook. Call end_batch for a final partial batch and end_epoch for epoch updates; per-episode commit and close do not imply those learning boundaries.",
    "Snapshots carry native vector/payload bytes and logical memory state inline. The typed sidecar preserves mapping order, NumPy values and date/datetime metadata; unsupported arbitrary object values raise TypeError. Incomplete legacy schema-1 adapter states are rejected; there is no migration. Loading or restoring read-only state rewinds Python's process-global random generator, affecting other components that use random in the same process; concurrent scopes do not have isolated RNG contexts. NumPy RNG, provider/circuit-breaker state, usage/logs, UUID/time sources and physical filesystem history are not restored, so identical stochastic replay is not promised.",
    "Preflight verifies bundled source revision and hashes without provider initialization. Explicit runtime.source_roots.memq overrides are supported; archives without Git metadata or an inventory report an unverified revision.",
    "The vector dimension must match the framework embedder output. The default is 3072 to match the official text-embedding-3-large profile; configure vector_dim/embedding_dims together when changing models."
  ],
  "tags": ["episodic", "procedural", "reinforcement-learning", "q-learning", "provenance"],
