[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-agent-sdk"
description = "SDK for building OpenHospital contest doctor agents."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["openhospital", "agent", "sdk", "medical-ai", "contest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "Flask>=3.0,<4",
  "markdown2>=2.4",
  "PyYAML>=6.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/baconroot/hospital-agent-sdk"
Issues = "https://github.com/baconroot/hospital-agent-sdk/issues"

[tool.setuptools.packages.find]
include = ["hospital_agent_sdk*"]

[tool.setuptools.dynamic]
version = { attr = "hospital_agent_sdk._version.__version__" }
